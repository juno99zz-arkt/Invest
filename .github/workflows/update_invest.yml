name: 투자 대시보드 업데이트

on:
  workflow_dispatch:        # 수동 실행 / repository_dispatch 트리거
    inputs:
      mode:
        description: "daily = 시세 갱신 / weekly = 신호·추천·뉴스 재분석 / compare = Opus·Sonnet 3종목 비교 (weekly·compare는 Claude API 비용 발생)"
        type: choice
        options: [daily, weekly, compare]
        default: daily
      compare_tickers:
        description: "compare 모드 종목 지정 (예: MSFT,V,ASML). 비우면 정량 상위 후보 3개"
        type: string
        default: ""
  schedule:
    - cron: "0 8 * * *"    # 매일 KST 17:00 (UTC 08:00) 시세 갱신
    # 모델 비교 결과로 분석 모델을 정할 때까지 주간 자동 실행 일시 중지 (수동 weekly 실행은 가능)
    # - cron: "0 0 * * 6"    # 매주 토요일 KST 09:00 (UTC 00:00) 주간 신호·추천 (미국장 금요일 마감 후)

permissions:
  contents: write

concurrency:
  group: invest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주간 파이프라인 (신호·심층분석·추천)
        if: github.event.schedule == '0 0 * * 6' || inputs.mode == 'weekly'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_weekly.py

      - name: 주간 결과 main 커밋 (추천 이력 보존)
        if: github.event.schedule == '0 0 * * 6' || inputs.mode == 'weekly'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "주간 신호·추천 갱신: $(TZ=Asia/Seoul date +%G-W%V)"
          git push

      - name: 모델 비교 (Opus 5 vs Sonnet 5)
        if: inputs.mode == 'compare'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPARE_TICKERS: ${{ inputs.compare_tickers }}
        run: |
          python compare_models.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compare/
          git diff --cached --quiet || git commit -m "모델 비교 결과: $(TZ=Asia/Seoul date +%F)"
          git push

      - name: 투자 대시보드 생성
        run: python generate_invest.py

      - name: gh-pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
