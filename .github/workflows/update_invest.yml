name: 투자 대시보드 업데이트 (Agent)

# Claude API 비용 0원 구조
#   매일 06:00 KST daily   : 미국 장 마감 후 시세·PEG·M7/M8·알림 갱신 + 매도 신호 푸시 (토요일은 prepare)
#   토 06:00 KST  prepare  : 정량 신호·후보 선정·분석 요청서(data/pending/request.json) 생성
#   매일 07:00    Agent 가 분석 (토: 주간 전체, 평일: 보유 종목 점검·필요 시 중간 재평가) → data/aside/result.json 업로드(push)
#   push 감지     finalize : 편입·유지·제외 결정 + 이력·리포트 갱신 → (토요일이면) 주간 메일 발송
#   토 21:00 KST  report   : 안전망 — 그 주 메일이 아직 안 나갔으면 현재 대시보드 기준으로 발송
#   미국 장중 30분마다 watch : 보유 종목 가격 경고(약세 시나리오 도달·급락)만 점검 → 매도 경고 푸시 (배포 없음)
# 푸시: ntfy.sh (시크릿 NTFY_TOPIC, 휴대폰 ntfy 앱에서 같은 토픽 구독)
#   (모든 실행 마지막에 대시보드 생성 → gh-pages 배포)
# 메일: EMAIL_SENDER(juno99zz@gmail.com) / EMAIL_PASSWORD(Gmail 앱 비밀번호) / INVEST_REPORT_TO(쉼표 구분 수신자)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 시세 갱신·매도 신호 점검 / prepare = 주간 신호·후보·분석요청서 생성 / finalize = Agent 결과 반영 / report = 주간 메일 즉시 발송 / watch = 장중 가격 경고만 / push_test = 테스트 푸시 / explain = 후보 순위 진단 / sec_check = SEC 접근 점검"
        type: choice
        options: [daily, prepare, finalize, report, watch, push_test, explain, sec_check]
        default: daily
      tickers:
        description: "explain 모드: 탈락 사유를 볼 티커 (예: AMD,AVGO)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["data/aside/**"]
  schedule:
    - cron: "0 21 * * 0-4,6"        # 매일 KST 06:00 (일~금) 시세 갱신·매도 신호 점검
    - cron: "0 21 * * 5"            # 매주 토 KST 06:00 주간 prepare (+시세 갱신·매도 신호 점검)
    - cron: "15,45 13-20 * * 1-5"   # 미국 장중 30분마다 (KST 22:15~05:45) 가격 경고 감시
    - cron: "0 12 * * 6"            # 매주 토 KST 21:00 주간 메일 안전망

permissions:
  contents: write

concurrency:
  group: invest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then m=finalize
          elif [ "${{ github.event.schedule }}" = "0 21 * * 5" ]; then m=prepare
          elif [ "${{ github.event.schedule }}" = "15,45 13-20 * * 1-5" ]; then m=watch
          elif [ "${{ github.event.schedule }}" = "0 12 * * 6" ]; then m=report_auto
          elif [ -n "${{ inputs.mode }}" ]; then m="${{ inputs.mode }}"
          else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "실행 모드: $m"

      - name: SEC 접근 점검
        if: steps.mode.outputs.mode == 'sec_check'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_data.py

      - name: 주간 prepare (신호·후보·분석 요청서)
        if: steps.mode.outputs.mode == 'prepare'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_weekly.py prepare

      - name: finalize (Agent 분석 결과 반영)
        if: steps.mode.outputs.mode == 'finalize'
        run: python run_weekly.py finalize

      - name: 후보 순위 진단
        if: steps.mode.outputs.mode == 'explain'
        env:
          EXPLAIN_TICKERS: ${{ inputs.tickers }}
        run: python explain.py

      - name: 데이터 커밋
        if: steps.mode.outputs.mode == 'prepare' || steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'explain'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "주간 ${{ steps.mode.outputs.mode }}: $(TZ=Asia/Seoul date +%G-W%V)"
          git pull --rebase origin main
          git push

      - name: 테스트 푸시
        if: steps.mode.outputs.mode == 'push_test'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py --test

      - name: 투자 대시보드 생성
        if: steps.mode.outputs.mode != 'watch' && steps.mode.outputs.mode != 'push_test'
        run: python generate_invest.py

      - name: 매도 신호 푸시
        id: push
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'prepare' || steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'watch'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "watch" ]; then python notify.py --prices; else python notify.py; fi

      - name: 푸시 기록 커밋
        if: steps.push.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "매도 신호 푸시 기록: $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase --autostash origin main
          git push

      # 메일·발송 기록 커밋은 gh-pages 배포 전에 실행 (배포 액션 이후엔 작업 폴더의 git 저장소를 쓸 수 없음: "not in a git directory")
      - name: 주간 메일 리포트 (토요일 · 주 1회)
        id: mail
        if: steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'report_auto' || steps.mode.outputs.mode == 'report'
        continue-on-error: true   # 메일 실패가 배포 결과를 막지 않게
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INVEST_REPORT_TO: ${{ secrets.INVEST_REPORT_TO }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "report" ]; then
            python report_email.py --force    # 수동: 즉시 발송
          else
            python report_email.py --auto     # 토요일이고 이번 주 미발송일 때만
          fi

      - name: 메일 발송 기록 커밋
        if: steps.mail.outcome == 'success'
        continue-on-error: true   # 기록 실패가 배포를 막지 않게
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/email_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "주간 메일 발송 기록: $(TZ=Asia/Seoul date +%G-W%V)"
          git pull --rebase --autostash origin main
          git push

      - name: gh-pages 배포
        if: steps.mode.outputs.mode != 'watch' && steps.mode.outputs.mode != 'push_test'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
