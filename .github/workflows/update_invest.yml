name: 투자 대시보드 업데이트 (Agent)

# Claude API 비용 0원 구조
#   매일 06:11 KST prepare : 정량 신호·후보 선정·분석 요청서 + 시세·알림 갱신 (예약 실행은 2~3시간 늦을 수 있어 06:30 Agent 가 없으면 직접 실행)
#   매일 06:30    Agent 가 새 후보·변화 종목·보유 종목 분석 → data/aside/result.json 업로드(push)
#   push 감지     finalize : 편입·유지·제외 결정 + 이력·리포트 갱신 → 매수·매도 결정 시 즉시 메일 + 푸시
#   월·금 07:00 KST report : 정기 메일 리포트 (08:00 안전망, 날짜별 1회)
#   매달 마지막 금 07:00 : 정기 메일 직전 월간 신호 검증(postmortem.py) → 메일에 '⑦ 월간 신호 검증' 포함
#   미국 장중 3회 watch    : 보유 종목 가격 경고(약세 시나리오 도달·급락)만 점검 → 매도 경고 메일·푸시 (배포 없음)
# 수시 알림(매수·매도 신호): 메일(INVEST_REPORT_TO) + ntfy 푸시(시크릿 NTFY_TOPIC) 동시
#   (모든 실행 마지막에 대시보드 생성 → gh-pages 배포)
# 메일: EMAIL_SENDER(juno99zz@gmail.com) / EMAIL_PASSWORD(Gmail 앱 비밀번호) / INVEST_REPORT_TO(쉼표 구분 수신자)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 시세 갱신·매도 신호 점검 / prepare = 주간 신호·후보·분석요청서 생성 / finalize = Agent 결과 반영 / report = 정기 메일 즉시 발송 / watch = 장중 가격 경고만 / push_test = 테스트 푸시·메일 / postmortem = 월간 신호 검증만 실행(메일 없이 미리보기 저장) / explain = 후보 순위 진단 / sec_check = SEC 접근 점검"
        type: choice
        options: [daily, prepare, finalize, report, watch, push_test, postmortem, explain, sec_check]
        default: daily
      tickers:
        description: "explain 모드: 탈락 사유를 볼 티커 (예: AMD,AVGO)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["data/aside/**"]
  schedule:
    # GitHub 예약 실행은 정각에 몰려 수 시간씩 밀리는 일이 잦아 정각을 피함 (+ 06:30 Agent 가 누락 시 수동 실행)
    - cron: "11 21 * * *"           # 매일 KST 06:11 prepare (정량 신호·후보·분석 요청서 + 시세 갱신·신호 점검) → 06:30 Agent 분석
    - cron: "7 15,17,19 * * 1-5"    # 미국 장중 3회 가격 경고 감시 (UTC 15:07/17:07/19:07 = KST 00:07/02:07/04:07, 미 동부 오전·점심·오후)
    - cron: "7 22 * * 0,4"          # 매주 월·금 KST 07:07 정기 메일 리포트
    - cron: "37 23 * * 0,4"         # 매주 월·금 KST 08:37 정기 메일 안전망 (날짜별 1회 — 이미 보냈으면 건너뜀)

permissions:
  contents: write

concurrency:
  group: invest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then m=finalize
          elif [ "${{ github.event.schedule }}" = "11 21 * * *" ]; then m=prepare
          elif [ "${{ github.event.schedule }}" = "7 15,17,19 * * 1-5" ]; then m=watch
          elif [ "${{ github.event.schedule }}" = "7 22 * * 0,4" ] || [ "${{ github.event.schedule }}" = "37 23 * * 0,4" ]; then m=report_auto
          elif [ -n "${{ inputs.mode }}" ]; then m="${{ inputs.mode }}"
          else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "실행 모드: $m"

      - name: SEC 접근 점검
        if: steps.mode.outputs.mode == 'sec_check'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_data.py

      - name: 주간 prepare (신호·후보·분석 요청서)
        if: steps.mode.outputs.mode == 'prepare'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_weekly.py prepare

      - name: finalize (Agent 분석 결과 반영)
        if: steps.mode.outputs.mode == 'finalize'
        run: python run_weekly.py finalize

      - name: 후보 순위 진단
        if: steps.mode.outputs.mode == 'explain'
        env:
          EXPLAIN_TICKERS: ${{ inputs.tickers }}
        run: python explain.py

      - name: 데이터 커밋
        if: steps.mode.outputs.mode == 'prepare' || steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'explain'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "주간 ${{ steps.mode.outputs.mode }}: $(TZ=Asia/Seoul date +%G-W%V)"
          git pull --rebase origin main
          git push

      - name: 테스트 푸시·메일
        if: steps.mode.outputs.mode == 'push_test'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INVEST_REPORT_TO: ${{ secrets.INVEST_REPORT_TO }}
        run: python notify.py --test --mail

      - name: 투자 대시보드 생성
        if: steps.mode.outputs.mode != 'watch' && steps.mode.outputs.mode != 'push_test'
        run: python generate_invest.py

      - name: 매수·매도 신호 수시 알림 (메일 + ntfy 푸시)
        id: push
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'prepare' || steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'watch'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INVEST_REPORT_TO: ${{ secrets.INVEST_REPORT_TO }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "watch" ]; then python notify.py --prices; else python notify.py; fi

      - name: 푸시 기록 커밋
        if: steps.push.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "매수·매도 신호 알림 기록: $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase --autostash origin main
          git push

      - name: 월간 신호 검증 (매달 마지막 금요일 · signal-postmortem 방식)
        id: postmortem
        if: steps.mode.outputs.mode == 'report_auto' || steps.mode.outputs.mode == 'report' || steps.mode.outputs.mode == 'postmortem'
        continue-on-error: true   # 검증 실패가 정기 메일을 막지 않게
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "postmortem" ]; then
            python postmortem.py --force
            python report_email.py --dry-run --postmortem && mkdir -p data/postmortem && cp report_preview.html data/postmortem/preview.html
          else
            python postmortem.py --auto       # 마지막 금요일에만 실행
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postmortem data/fear_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "월간 신호 검증: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash origin main
          git push

      # 메일·발송 기록 커밋은 gh-pages 배포 전에 실행 (배포 액션 이후엔 작업 폴더의 git 저장소를 쓸 수 없음: "not in a git directory")
      - name: 정기 메일 리포트 (월·금 07:00)
        id: mail
        if: steps.mode.outputs.mode == 'report_auto' || steps.mode.outputs.mode == 'report'
        continue-on-error: true   # 메일 실패가 배포 결과를 막지 않게
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INVEST_REPORT_TO: ${{ secrets.INVEST_REPORT_TO }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "report" ]; then
            python report_email.py --force    # 수동: 즉시 발송
          else
            python report_email.py --auto     # 월·금이고 오늘 미발송일 때만
          fi

      - name: 메일 발송 기록 커밋
        if: steps.mail.outcome == 'success'
        continue-on-error: true   # 기록 실패가 배포를 막지 않게
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/email_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "정기 메일 발송 기록: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash origin main
          git push

      - name: gh-pages 배포
        if: steps.mode.outputs.mode != 'watch' && steps.mode.outputs.mode != 'push_test'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
