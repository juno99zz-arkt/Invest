# 투자 AI 분석 클라우드 시험 (Aside 루틴 이전 1단계, 2026-11-08)
#   Claude Code 를 헤드리스로 돌려 오늘 요청서를 분석하고, 결과를 Actions artifact 로만 남긴다.
#   finalize·커밋·배포·메일·푸시·옵시디언 노트는 하지 않는다 → 실제 대시보드·계좌에 영향 없음.
#   며칠간 Aside 결과(data/aside/result.json)와 비교한 뒤 update_invest.yml 의 mode=agent 로 전환한다.
# 필요한 시크릿: CLAUDE_CODE_OAUTH_TOKEN (PC 에서 `claude setup-token` 으로 발급, 1년)
name: 투자 AI 분석 (클라우드 시험)

on:
  schedule:
    - cron: "47 22 * * 0-4"   # 평일 07:47 KST — Aside(06:30) 분석 뒤 같은 요청서로 비교. GitHub 예약 지연은 비교에 지장 없음. 전환 후 삭제
  workflow_dispatch:
    inputs:
      allow_stale:
        description: "요청서가 오늘 날짜가 아니어도 분석 (시험용)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: invest-agent-dry
  cancel-in-progress: false

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      OUT: data/aside_dry
    steps:
      - name: 시크릿 확인
        env:
          HAS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          [ "$HAS" = "true" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN 시크릿을 등록하세요 (claude setup-token)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 요청서 날짜 확인
        run: |
          W=$(python -c "import json;print(json.load(open('data/pending/request.json',encoding='utf-8'))['week'])")
          T=$(date +%F)
          echo "요청서 $W · 오늘 $T"
          if [ "$W" != "$T" ] && [ "${{ inputs.allow_stale }}" != "true" ]; then
            echo "::error::요청서가 오늘 날짜가 아님 — prepare 실행 후 다시 시도"; exit 1
          fi

      - name: 분석 자료 준비
        run: python scripts/agent_context.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Claude 분석
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p "$OUT/analyses"
          EXTRA=""
          [ "${{ inputs.allow_stale }}" = "true" ] && EXTRA=" 지난 요청서 허용: 요청서가 오늘 날짜가 아니어도 그 요청서로 끝까지 분석한다(배관 시험)."
          claude -p "오늘 Invest 매일 AI 분석을 수행한다. .claude/skills/invest-daily/SKILL.md 를 먼저 읽고 그대로 따른다. 출력 폴더 \$OUT = $OUT. 시험 실행이므로 data/ 의 다른 파일은 절대 수정하지 않는다.$EXTRA" \
            --model claude-opus-5-5 \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,Bash(python:*),Bash(python3:*)" \
            --output-format text | tee "$OUT/claude_output.txt"

      - name: 결과 검증
        if: always()
        run: |
          if [ -f "$OUT/result.json" ]; then
            python aside_bridge.py data/pending/request.json "$OUT/result.json" | tee "$OUT/validation.txt"
          else
            echo "result.json 없음" | tee "$OUT/validation.txt"
          fi
          {
            echo "## 투자 AI 분석 (클라우드 시험) $(date '+%F %H:%M')"
            echo '```'; cat "$OUT/validation.txt"; echo '```'
            [ -f "$OUT/note.json" ] && python -c "import json;n=json.load(open('$OUT/note.json',encoding='utf-8'));print('**요약**', n.get('summary',''));[print('-',m) for m in n.get('memo',[])];[print('- ⚠', i) for i in n.get('issues',[])]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 보관 (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invest-agent-dry-${{ github.run_id }}
          path: |
            data/aside_dry/
            work/context.json
          retention-days: 14
