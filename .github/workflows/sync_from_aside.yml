name: 새 사이트(Invest-Aside) 코드·데이터 가져오기 (1회용)

# Invest-Aside main 의 코드·데이터를 이 저장소로 그대로 복사한다 (.github 제외).
# 워크플로 파일은 GITHUB_TOKEN 으로 수정할 수 없어 별도로 올린다.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invest-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 이 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: dst

      - name: Invest-Aside 체크아웃
        uses: actions/checkout@v4
        with:
          repository: juno99zz-arkt/Invest-Aside
          ref: main
          path: src

      - name: 복사 후 커밋
        run: |
          # 이 저장소 전용으로 미리 올린 파일은 보존
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'report_email.py' --exclude 'README.md' src/ dst/
          cd dst
          sed -i 's#juno99zz-arkt/Invest-Aside/actions#juno99zz-arkt/Invest/actions#g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "새 사이트(Invest-Aside) 구조 적용: Claude API → Agent"
          git push
